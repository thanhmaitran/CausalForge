# Run from repo root: docker compose -f docker/docker-compose.yml up --build
# No dataset is loaded at startup.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: causalforge, POSTGRES_PASSWORD: change-me, POSTGRES_DB: causalforge }
    volumes: ["./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
  api:
    build: { context: .., dockerfile: docker/Dockerfile.api }
    environment: { CAUSALFORGE_DB: /data/cf.sqlite }
    volumes: ["../artifacts:/app/artifacts"]
    ports: ["8000:8000"]
    depends_on: [postgres]
  frontend:
    build: { context: .., dockerfile: docker/Dockerfile.frontend }
    ports: ["3000:80"]
    depends_on: [api]
